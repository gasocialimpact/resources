# Publishes the site to GitHub Pages on every push to main.
#
# Most tools are static files and are published as they are. Brainstorm Board
# (next) is a Vite app, so it's built first and its build output is published
# at /brainstorm-board-next/. Supabase settings come from the repository's
# Actions variables SUPABASE_URL and SUPABASE_ANON_KEY (the anon key is public
# by design; access is controlled in the database).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brainstorm-board-next/package-lock.json

      - name: Build Brainstorm Board
        working-directory: brainstorm-board-next
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir _site
          # Tracked files only, minus repo plumbing and folders that were never
          # published (Jekyll hid _template).
          git ls-files -z \
            | grep -zvE '^(\.github/|\.claude/|_template/|brainstorm-board-next/)|(^|/)\.DS_Store$' \
            | xargs -0 cp --parents -t _site
          mkdir -p _site/brainstorm-board-next
          cp -R brainstorm-board-next/dist/. _site/brainstorm-board-next/

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
